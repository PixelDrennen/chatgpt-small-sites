<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perforce Workspace Monitor</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<header class="top-shell">
  <div class="brand-row"><div class="brand"><span class="brand-mark">P4</span><strong>Perforce Workspace Monitor</strong></div><span id="build-label" class="muted">Local dashboard</span></div>
  <form id="connection-form" class="connection-row">
    <input name="P4PORT" aria-label="Perforce server" placeholder="P4PORT" required><input name="P4USER" aria-label="Perforce user" placeholder="P4USER" required>
    <div class="workspace-picker"><input name="P4CLIENT" id="client-input" list="client-history" aria-label="Workspace" placeholder="P4CLIENT" required><datalist id="client-history"></datalist><button type="button" id="remove-client" title="Remove selected saved workspace">×</button></div>
    <button class="btn-compact primary" type="submit">Connect</button><span id="workspace-stream" class="workspace-string">Not connected</span>
  </form>
  <nav class="action-row">
    <button data-action="merge-down">⇣ Merge down</button><button data-action="copy-up">⇡ Copy up</button><button data-action="submit" class="submit-action">Submit selected</button>
    <select id="action-change" aria-label="Selected changelist"><option value="">Select changelist…</option></select><span class="separator"></span><button id="refresh">↻ Refresh</button><span id="notice" role="status"></span>
  </nav>
</header>
<main class="app-layout">
  <aside class="change-sidebar"><div class="pane-title"><div><h2>Changelists</h2><span id="change-total">0 changes</span></div></div><div class="change-tabs"><button class="active" data-change-scope="all">All</button><button data-change-scope="incoming">Incoming</button><button data-change-scope="outgoing">Outgoing</button></div><div id="change-list" class="change-list"></div></aside>
  <section class="file-workspace">
    <div class="filterbar">
      <div class="segmented" id="scope-switch"><button class="active" data-scope="changed">Changed</button><button data-scope="all">All files</button></div>
      <div class="segmented" id="view-switch"><button class="active" data-view="list" title="List view">☷</button><button data-view="grid" title="Grid view">▦</button><button data-view="tree" title="Folder hierarchy">⌘</button></div>
      <input id="file-search" type="search" placeholder="Filter by name or path…">
      <select id="type-filter"><option value="">All types</option></select><select id="date-filter"><option value="">Any date</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
      <div class="action-filters"><label><input type="checkbox" value="add" checked> <span class="dot add"></span>Adds</label><label><input type="checkbox" value="modify" checked> <span class="dot modify"></span>Edits</label><label><input type="checkbox" value="delete" checked> <span class="dot delete"></span>Deletes</label></div>
    </div>
    <div class="file-columns"><section class="file-pane"><div class="pane-title"><div><h2>Depot files</h2><span id="depot-summary">0 files</span></div></div><div id="depot-files" class="file-view list-view"></div></section><section class="file-pane"><div class="pane-title"><div><h2>Workspace files</h2><span id="workspace-summary">0 files</span></div></div><div id="workspace-files" class="file-view list-view"></div></section></div>
  </section>
</main>
<dialog id="action-dialog"><form method="dialog"><h2 id="dialog-title">Confirm Perforce action</h2><p id="dialog-copy"></p><pre id="dialog-command"></pre><menu><button value="cancel">Cancel</button><button id="confirm-action" value="confirm" class="danger-button">Run action</button></menu></form></dialog>
<script>if(location.protocol==='file:'){document.body.innerHTML='<main class="direct-warning"><h1>Start the local monitor first</h1><p>Run <code>bash start-monitor.sh</code>, then use <code>http://127.0.0.1:8765</code>.</p></main>'}else{const script=document.createElement('script');script.src='/app.js';document.body.append(script)}</script></body></html>
